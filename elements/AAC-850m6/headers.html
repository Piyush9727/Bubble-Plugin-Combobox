<style>
/* Premium Combobox UI/UX Styles */
.cb-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  box-sizing: border-box;
  font-family: inherit;
}

.cb-input-container {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
}

.cb-input {
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
  outline: none;
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  padding-right: 32px;
  box-sizing: border-box;
  cursor: text;
}

.cb-input::placeholder {
  color: rgba(100, 116, 139, 0.7);
  opacity: 1;
}

/* Controls & Icons */
.cb-icon-wrapper {
  position: absolute;
  right: 8px;
  display: flex;
  align-items: center;

  color: #64748b;

}

.cb-clear-btn {

  height: 18px;
  border-radius: 50%;
  background: rgba(148, 163, 184, 0.2);
  color: #64748b;
  font-size: 11px;
  line-height: 1;
  border: none;
  padding: 0;
  transition: background 0.15s ease, color 0.15s ease;
}

.cb-clear-btn:hover {
  background: rgba(239, 68, 68, 0.2);
  color: #ef4444;
}

.cb-chevron {
  width: 16px;
  height: 16px;
  fill: currentColor;
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.cb-wrapper.cb-expanded .cb-chevron {
  transform: rotate(180deg);
}

.cb-listbox {

  list-style: none;

  font-size: 14px;
  color: #1e293b;
  animation: cbFadeIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes cbFadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

.cb-listbox::-webkit-scrollbar {
  width: 6px;
}
.cb-listbox::-webkit-scrollbar-track {

}
.cb-listbox::-webkit-scrollbar-thumb {

}

  color: #2563eb;

}
